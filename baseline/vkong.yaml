type: service
app: zipformer-asr-baseline
app_port: 8000

gpu: RTX-3060-12GB   # same card as the vieneu benchmarks; bare "RTX 3060" also allows 8 GB / Ti
num_gpus: 1
cpu_cores: 8         # the load client runs on this host too
ram_gb: 16
disk_gb: 40
max_dph: 0.35
verified_only: true

image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
# libasound2: sherpa-onnx links ALSA. model.py downloads the model and the upstream C++ release binary,
# audio.py LibriSpeech test-clean.
init_cmd: apt-get update -qq && apt-get install -y -qq libasound2 && pip install -r requirements.txt && python model.py && python audio.py
# bench.py only starts the server under test (POST /server) and the load client (POST /benchmark).
start: env PROVIDER=cuda python -u bench.py
